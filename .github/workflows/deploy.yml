# Builds, checks and deploys the service with the shared workflow of the
# organization: https://github.com/variamosple/.github
name: deploy

on:
  push:
    branches: [main, ci/use-shared-deploy-workflow]
  workflow_dispatch:

jobs:
  deploy:
    uses: variamosple/.github/.github/workflows/deploy.yml@v1
    with:
      image: vms_language_reviews
      service: vmslanguagereviewsaws
      health-url: https://app.variamos.com/vms_language_reviews/health
      health-name: vms_language_reviews
    secrets: inherit
